
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProPart Millán - V-Link</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    
    <style>
        :root { --primary: #00d2ff; --bg: #121212; --panel: #1e1e1e; --text: #fff; --success: #00ff88; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; user-select: none; }
        
        header { background: #000; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); }
        .brand { font-size: 1.2rem; font-weight: 800; text-transform: uppercase; }
        .brand span { color: var(--primary); }
        .led { width: 12px; height: 12px; background: #333; border-radius: 50%; border: 2px solid #555; }
        .led.on { background: var(--success); box-shadow: 0 0 10px var(--success); border-color: #fff; }

        .container { padding: 20px; max-width: 800px; margin: 0 auto; }
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        
        .tile { background: var(--panel); border: 1px solid #333; border-radius: 15px; padding: 25px 10px; text-align: center; cursor: pointer; }
        .tile:active { transform: scale(0.96); background: #252525; }
        .tile i { font-size: 2.5rem; color: var(--primary); display: block; margin-bottom: 10px; }
        .tile.connect { grid-column: span 2; background: rgba(0, 210, 255, 0.1); border-color: var(--primary); }
        
        .screen { display: none; }
        .screen.active { display: block; }
        
        #console-output { background: #000; color: var(--success); font-family: monospace; padding: 15px; height: 150px; overflow-y: auto; border: 1px solid #333; margin-bottom: 10px; font-size: 0.9rem; }
        .btn-back { background: transparent; border: 1px solid #555; color: #aaa; padding: 10px 20px; border-radius: 20px; margin-bottom: 20px; }
        @import url('https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css');
    </style>
</head>
<body>

<header>
    <div class="brand">PROPART <span>MILLÁN</span></div>
    <div style="display:flex; align-items:center; gap:10px;">
        <span style="font-size:0.7rem; color:#aaa;">IOS-VLINK</span>
        <div id="connection-led" class="led"></div>
    </div>
</header>

<div class="container">
    <div id="menu-screen" class="screen active">
        <h2 style="text-align:center;">Panel de Control</h2>
        <div class="dashboard-grid">
            <div class="tile connect" onclick="conectarScanner()">
                <i class="fas fa-plug" id="icon-conn"></i>
                <h3 id="text-conn">CONECTAR ESCÁNER</h3>
                <div style="font-size:0.7rem; color:#aaa; margin-top:5px;">Especial para IOS-Vlink</div>
            </div>
            <div class="tile" onclick="irA('scanner-screen')"><i class="fas fa-heartbeat"></i><h3>Diagnóstico</h3></div>
        </div>
    </div>

    <div id="scanner-screen" class="screen">
        <button class="btn-back" onclick="irA('menu-screen')">Volver</button>
        <h2>Datos en Vivo</h2>
        <div id="console-output">Esperando conexión...<br>>_</div>
        <div class="dashboard-grid">
            <button class="tile" onclick="enviarComando('0105')">Temp. Motor</button>
            <button class="tile" onclick="enviarComando('010C')">RPM</button>
            <button class="tile" onclick="enviarComando('AT RV')">Voltaje</button>
            <button class="tile" style="border-color:red; color:red;" onclick="enviarComando('04')">Borrar DTC</button>
        </div>
    </div>
</div>

<script>
    function irA(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }
    function log(txt) {
        const d = document.getElementById('console-output');
        d.innerHTML += `<div>${txt}</div>`;
        d.scrollTop = d.scrollHeight;
    }

    let device, server, service, characteristic;

    // AQUI ESTA LA MAGIA: Incluimos el UUID "Secreto" de Vgate (E781...)
    const VGATE_SERVICE = 'e7810a71-73ae-499d-8c15-faa9aef0c3f2';
    const VGATE_CHAR    = 'bef8d6c9-9c21-4c9e-b632-bd58c1009f9f';
    
    // Lista de canales a pedir permiso
    const OPTIONAL_SERVICES = [
        VGATE_SERVICE, 
        '0000fff0-0000-1000-8000-00805f9b34fb',
        '0000ffe0-0000-1000-8000-00805f9b34fb'
    ];

    async function conectarScanner() {
        try {
            log("📡 Buscando IOS-Vlink...");
            
            device = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true,
                optionalServices: OPTIONAL_SERVICES
            });

            log("Conectando a " + device.name + "...");
            server = await device.gatt.connect();
            log("✅ Servidor Conectado.");

            // 1. INTENTO VGATE (El más probable para tu scanner)
            try {
                log("Probando canal V-Link (E781)...");
                service = await server.getPrimaryService(VGATE_SERVICE);
                characteristic = await service.getCharacteristic(VGATE_CHAR);
                log("¡CANAL VGATE ENCONTRADO! 🔓");
            } catch (e) {
                log("Vgate falló, probando genéricos...");
                // 2. INTENTO GENÉRICO
                try {
                    service = await server.getPrimaryService('0000ffe0-0000-1000-8000-00805f9b34fb');
                    characteristic = await service.getCharacteristic('0000ffe1-0000-1000-8000-00805f9b34fb');
                    log("Canal Genérico OK");
                } catch(err2) {
                    throw "No se encontró ningún canal de datos compatible.";
                }
            }

            // EXITO
            document.getElementById('connection-led').classList.add('on');
            document.getElementById('text-conn').innerText = "CONECTADO ✅";
            document.getElementById('icon-conn').className = "fas fa-link";
            log("¡SISTEMA OPERATIVO!");

            // Comandos de inicialización
            await enviarComando("ATZ");
            setTimeout(() => irA('scanner-screen'), 1000);

        } catch (error) {
            log("❌ Error: " + error);
        }
    }

    async function enviarComando(cmd) {
        if (!characteristic) return log("Error: No conectado");
        try {
            let enc = new TextEncoder();
            await characteristic.writeValue(enc.encode(cmd + '\r'));
            log(">> " + cmd);
        } catch (e) { log("Error envío: " + e); }
    }
    
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
