
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ProPart Detective</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; padding: 20px; }
        button { font-size: 1.5rem; padding: 20px; width: 100%; background: #333; color: #fff; border: 1px solid #fff; margin-bottom: 20px; }
        #log { border: 1px solid #0f0; padding: 10px; height: 300px; overflow: auto; }
    </style>
</head>
<body>
    <h1>MODO DETECTIVE 🕵️‍♂️</h1>
    <p>Este código busca CUALQUIER servicio disponible en tu escáner.</p>
    <button onclick="espiarScanner()">1. BUSCAR Y ESPIAR</button>
    
    <div id="log">Bitácora de conexión...</div>

    <script>
        function log(txt) { 
            document.getElementById('log').innerHTML += "<div>> " + txt + "</div>"; 
        }

        async function espiarScanner() {
            try {
                log("Iniciando búsqueda amplia...");
                
                // Pedimos acceso a TODOS los dispositivos
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [
                        // Lista de sospechosos comunes
                        '0000fff0-0000-1000-8000-00805f9b34fb',
                        '0000ffe0-0000-1000-8000-00805f9b34fb',
                        '00001800-0000-1000-8000-00805f9b34fb',
                        '0000180a-0000-1000-8000-00805f9b34fb'
                    ]
                });

                log("Conectando a: " + device.name);
                const server = await device.gatt.connect();
                log("¡CONECTADO AL SERVIDOR! ✅");
                log("Nombre: " + device.name);
                log("ID: " + device.id);
                log("Intentando leer servicios primarios...");

                // Intentamos ver qué tiene adentro
                try {
                    const services = await server.getPrimaryServices();
                    log("Servicios encontrados: " + services.length);
                    services.forEach(service => {
                        log("UUID ENCONTRADO: " + service.uuid);
                    });
                    log("¡Mándale una foto a Julss de estos números!");
                } catch(err) {
                    log("No pude listar servicios (bloqueo de seguridad), pero SÍ conectó.");
                    log("Intenta con el UUID FFE0 o FFF0 manual.");
                }

            } catch (error) {
                log("❌ ERROR FATAL: " + error);
                if (error.toString().includes("User cancelled")) {
                    log("TIP: Asegúrate de seleccionar el dispositivo en la lista.");
                }
                if (error.toString().includes("no device")) {
                    log("TIP: Si la lista estaba vacía, tu escáner NO es compatible con Web (Es Bluetooth Clásico).");
                }
            }
        }
    </script>
</body>
</html>
