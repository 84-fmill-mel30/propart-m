        .top-bar { background: #111; padding: 15px; border-bottom: 2px solid var(--blue); text-align: center; box-shadow: 0 0 15px var(--blue); }

        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .card { background: #111; border: 1px solid #333; border-left: 4px solid var(--purple); padding: 15px; margin-top: 15px; border-radius: 5px; }
        .btn { background: var(--blue); color: #000; border: none; padding: 15px; width: 100%; font-family: 'Orbitron'; font-weight: bold; margin-top: 10px; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        .btn:active { transform: scale(0.95); opacity: 0.8; }
        .nav { position: fixed; bottom: 0; width: 100%; background: #000; border-top: 2px solid var(--purple); display: flex; justify-content: space-around; padding: 12px 0; z-index: 100; }
        .nav-item { color: #555; font-size: 0.7rem; text-align: center; flex: 1; cursor: pointer; }
        .nav-item.active { color: var(--blue); text-shadow: 0 0 10px var(--blue); font-weight: bold; }
        input { width: 100%; padding: 15px; background: #000; color: var(--blue); border: 1px solid var(--blue); font-family: 'Orbitron'; text-align: center; box-sizing: border-box; font-size: 1.1rem; }
